[versions]
agp = "8.11.1"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
hilt = "2.56.2"
hiltNavigationCompose = "1.2.0"
# 33.7.0 → 33.16.0 (v1.6.82 ②-4). **firebase-ai 를 주는 가장 낮은 BOM**이면서
# `firebase-common` 을 21.0.0 그대로 두는 마지막 줄기다 — auth 23.1.0→23.2.1,
# firestore 25.1.1→25.1.4 로 마이너만 움직인다. BOM 34.x 는 common 22 · auth 24 ·
# firestore 26 **메이저 점프**라 로그인·근무표 저장 전부를 다시 검증해야 해서 피했다.
firebaseBom = "33.16.0"
googleServices = "4.4.2"
glance = "1.1.1"
coroutines = "1.9.0"
workManager = "2.10.0"
hiltWork = "1.2.0"
desugar = "2.1.3"
# 식단표 글자인식(v1.6.80). **다운로드형(unbundled)** — 한국어 모델은 구글 플레이 서비스 쪽에 있고
# APK 에는 얇은 접착제만 들어간다. 번들판(com.google.mlkit:text-recognition-korean)은 모델 4MB 를
# 전 직원 APK 에 태우는데, 이 기능을 쓰는 사람은 관리자 하나뿐이라 그럴 값어치가 없다.
mlkitTextKorean = "16.0.1"
# 식단표 한글파일(.hwp) 읽기(v1.6.81 ④). Apache-2.0 · 0.96MB · **의존성 0개**(POM 에
# <dependencies> 자체가 없다). Apache POI 를 끌어오지 않고 필요한 POIFS 부분만 자기
# 패키지(kr.dogfoot.hwplib.org.apache.poi.*)로 품고 있어 안드로이드에서 그대로 돈다.
# .hwpx 는 zip+XML 이라 자바 표준만으로 읽는다 — hwpxlib(1.24MB)은 안 넣었다(MenuHwpx 주석).
hwplib = "1.1.10"
# 주간식단표 **PDF 글자층 직접 추출**(v1.6.82 ②-1). Apache-2.0 · AAR 3.25MB.
# v1.6.80~81 은 PdfRenderer 로 그림을 그려 글자인식했다 — **PDF 안에 이미 완성돼 있는 글자를
# 버리고 사진처럼 다시 읽는** 구조라 정확도가 떨어졌다. PDFBox 는 글자와 그 좌표(TextPosition)를
# 그대로 준다. 이 조건(Apache/MIT · 글자별 좌표 · minSdk 26)에서 더 가벼운 대안이 없다 —
# pdfium 계열은 네이티브 .so 라 3배 무겁고, 안드로이드 내장 `PdfRenderer.getTextContents()` 는
# **API 35+** 라 minSdk 26 을 못 받친다.
pdfboxAndroid = "2.0.27.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

mlkit-text-korean = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-korean", version.ref = "mlkitTextKorean" }

hwplib = { group = "kr.dogfoot", name = "hwplib", version.ref = "hwplib" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }

# 식단표 **사진**을 클라우드 AI 가 읽는다(v1.6.82 ②-4). BOM 이 주는 16.2.0.
# `GenerativeBackend.googleAI()` = Gemini Developer API 백엔드라 **Spark(무료) 요금제 그대로** 쓴다
# (Vertex 백엔드는 Blaze 필수). API 키는 앱에 안 들어간다 — Firebase 가 서비스 계정으로 인가한다.
firebase-ai = { group = "com.google.firebase", name = "firebase-ai" }

androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
